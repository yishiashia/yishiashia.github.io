<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" role="img" aria-label="合約變更分類：不影響已確認需求的修改不一定需要重新驗收，但仍要記錄；影響需求或合約指紋的變更則要建立新版本並重新驗收">
  <defs>
    <style>
      .bg{fill:#f6f9fb;stroke:#e2e8f0;}
      .card{fill:#ffffff;stroke:#dbe4ec;}
      .ink{fill:#0b1728;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;}
      .muted{fill:#708199;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;}
      .green{fill:#178b6b;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;font-weight:700;}
      .red{fill:#c0432a;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;font-weight:700;}
      .arrow{stroke:#708199;stroke-width:2;fill:none;}
      .head{fill:#708199;}
      .divider{stroke:#e2e8f0;stroke-width:1;}
    </style>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="1039" height="399" rx="16"/>
  <text class="ink" x="520" y="39" text-anchor="middle" font-size="21" font-weight="700">不是每個字元變動，都等於需求變更</text>
  <text class="muted" x="520" y="64" text-anchor="middle" font-size="13">先確認已確認需求與合約指紋，再判斷是否影響下游</text>

  <rect class="card" x="36" y="135" width="190" height="104" rx="14"/>
  <text class="ink" x="131" y="177" text-anchor="middle" font-size="17" font-weight="700">變更內容</text>
  <text class="muted" x="131" y="204" text-anchor="middle" font-size="12">文件、contract、metadata</text>

  <line class="arrow" x1="228" y1="187" x2="306" y2="187"/>
  <polygon class="head" points="312,187 304,182 304,192"/>
  <text class="muted" x="270" y="174" text-anchor="middle" font-size="11">固定規則判定</text>

  <rect x="318" y="88" width="674" height="115" rx="14" fill="#e6f6ef" stroke="#a3d8c5"/>
  <text class="green" x="344" y="123" font-size="17">非實質修改</text>
  <line class="divider" x1="532" y1="105" x2="532" y2="186"/>
  <text class="ink" x="554" y="123" font-size="14">格式、顯示資訊，且治理規則明確允許</text>
  <text class="muted" x="344" y="153" font-size="12">已確認需求不變</text>
  <text class="muted" x="344" y="176" font-size="12">合約指紋不變</text>
  <text class="ink" x="554" y="164" font-size="14" font-weight="700">不一定重新驗收，但仍要記錄修改</text>

  <rect x="318" y="220" width="674" height="115" rx="14" fill="#fce9e4" stroke="#eab3a6"/>
  <text class="red" x="344" y="255" font-size="17">實質變更</text>
  <line class="divider" x1="532" y1="237" x2="532" y2="318"/>
  <text class="ink" x="554" y="255" font-size="14">已確認需求、合約欄位、狀態轉換</text>
  <text class="muted" x="344" y="285" font-size="12">已確認需求改變</text>
  <text class="muted" x="344" y="308" font-size="12">合約指紋改變</text>
  <text class="ink" x="554" y="296" font-size="14" font-weight="700">建立新版本，下游重新驗收</text>

  <text class="red" x="520" y="374" text-anchor="middle" font-size="13">無法明確判定 → 需要重新驗收（fail closed）→ 不沿用舊核准</text>
</svg>
