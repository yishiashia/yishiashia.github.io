<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 390" role="img" aria-label="從 DECLARE 宣告需求，到 BIND 建立內容指紋，再由可選的數位簽署確認來源，最後交給驗收與審查使用固定的版本">
  <defs>
    <style>
      .bg{fill:#f6f9fb;stroke:#e2e8f0;}
      .card{fill:#ffffff;stroke:#dbe4ec;}
      .ink{fill:#0b1728;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;}
      .muted{fill:#708199;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;}
      .mint{fill:#179f7c;}
      .mint-text{fill:#178b6b;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;font-weight:700;}
      .purple{fill:#7067b7;}
      .purple-text{fill:#554c9a;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;font-weight:700;}
      .arrow{stroke:#708199;stroke-width:2;fill:none;}
      .head{fill:#708199;}
      .dash{stroke:#b7c2ce;stroke-width:1.5;stroke-dasharray:5 5;}
    </style>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="1079" height="389" rx="16"/>
  <text class="ink" x="540" y="39" text-anchor="middle" font-size="21" font-weight="700">把規格固定成可驗證的合約</text>
  <text class="muted" x="540" y="64" text-anchor="middle" font-size="13">先說清楚，再固定內容；簽署是來源確認，不是授權本身</text>

  <g>
    <rect class="card" x="28" y="95" width="230" height="172" rx="14"/>
    <circle class="mint" cx="62" cy="129" r="16"/>
    <text x="62" y="134" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">1</text>
    <text class="mint-text" x="88" y="134" font-size="15">DECLARE</text>
    <text class="ink" x="50" y="174" font-size="19" font-weight="700">宣告邊界</text>
    <text class="muted" x="50" y="205" font-size="13">SDD / ADR / non-goals</text>
    <text class="muted" x="50" y="229" font-size="13">acceptance criteria</text>
  </g>

  <g>
    <rect class="card" x="286" y="95" width="230" height="172" rx="14"/>
    <circle class="purple" cx="320" cy="129" r="16"/>
    <text x="320" y="134" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">2</text>
    <text class="purple-text" x="346" y="134" font-size="15">BIND</text>
    <text class="ink" x="308" y="174" font-size="19" font-weight="700">建立版本基準</text>
    <text class="muted" x="308" y="205" font-size="13">固定範圍與版本</text>
    <text class="muted" x="308" y="229" font-size="13">artifact / contract fingerprint</text>
  </g>

  <g>
    <rect class="card" x="544" y="95" width="230" height="172" rx="14"/>
    <circle class="purple" cx="578" cy="129" r="16"/>
    <text x="578" y="134" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">3</text>
    <text class="purple-text" x="604" y="134" font-size="15">SIGN（可選）</text>
    <text class="ink" x="566" y="174" font-size="19" font-weight="700">確認來源</text>
    <text class="muted" x="566" y="205" font-size="13">signed reference /</text>
    <text class="muted" x="566" y="229" font-size="13">external signature</text>
  </g>

  <g>
    <rect class="card" x="802" y="95" width="250" height="172" rx="14"/>
    <circle class="mint" cx="836" cy="129" r="16"/>
    <text x="836" y="134" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">4</text>
    <text class="mint-text" x="862" y="134" font-size="15">VERIFY / REVIEW</text>
    <text class="ink" x="824" y="174" font-size="19" font-weight="700">固定審查邊界</text>
    <text class="muted" x="824" y="205" font-size="13">fixed version snapshot</text>
    <text class="muted" x="824" y="229" font-size="13">Evidence → Attestation</text>
  </g>

  <g>
    <line class="arrow" x1="264" y1="181" x2="278" y2="181"/>
    <polygon class="head" points="284,181 276,176 276,186"/>
    <line class="arrow" x1="522" y1="181" x2="536" y2="181"/>
    <polygon class="head" points="542,181 534,176 534,186"/>
    <line class="arrow" x1="780" y1="181" x2="794" y2="181"/>
    <polygon class="head" points="800,181 792,176 792,186"/>
  </g>

  <line class="dash" x1="45" y1="310" x2="1035" y2="310"/>
  <text class="muted" x="45" y="343" font-size="13">草稿階段：文件可以修改</text>
  <text class="ink" x="540" y="343" text-anchor="middle" font-size="13" font-weight="700">審查／核准後：新增版本與關聯，不覆寫已採用的歷史</text>
  <text class="muted" x="1035" y="343" text-anchor="end" font-size="13">Authority 仍是另一道決定</text>
</svg>
