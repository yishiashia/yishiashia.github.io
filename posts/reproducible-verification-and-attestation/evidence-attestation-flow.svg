<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 430" role="img" aria-label="從可重現檢查產出 Evidence，經由 Attestation 獨立確認，再由 Authority 判斷是否可以合併、發布或上線">
  <defs>
    <style>
      .bg{fill:#f6f9fb;stroke:#e2e8f0;}
      .card{fill:#ffffff;stroke:#dbe4ec;}
      .ink{fill:#0b1728;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;}
      .muted{fill:#708199;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;}
      .mint{fill:#179f7c;}
      .mint-text{fill:#178b6b;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;font-weight:700;}
      .purple{fill:#7067b7;}
      .purple-text{fill:#554c9a;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;font-weight:700;}
      .arrow{stroke:#708199;stroke-width:2;fill:none;}
      .head{fill:#708199;}
      .dash{stroke:#b7c2ce;stroke-width:1.5;stroke-dasharray:5 5;}
      .rule{stroke:#e3e9ef;stroke-width:1;}
    </style>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="1159" height="429" rx="16"/>
  <text class="ink" x="580" y="39" text-anchor="middle" font-size="21" font-weight="700">從驗收到放行：證據、獨立確認與授權</text>
  <text class="muted" x="580" y="64" text-anchor="middle" font-size="13">LLM review 可以提供意見，但不能單獨成為 Evidence 或放行依據</text>

  <g>
    <rect class="card" x="24" y="98" width="260" height="214" rx="14"/>
    <circle class="mint" cx="58" cy="132" r="16"/>
    <text x="58" y="137" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">1</text>
    <text class="mint-text" x="84" y="137" font-size="15">VERIFY</text>
    <text class="ink" x="46" y="178" font-size="19" font-weight="700">可重現檢查</text>
    <line class="rule" x1="46" y1="195" x2="262" y2="195"/>
    <text class="muted" x="46" y="222" font-size="13">固定版本與執行條件</text>
    <text class="muted" x="46" y="247" font-size="13">測試／靜態分析／CI</text>
    <text class="muted" x="46" y="272" font-size="13">機器產出的檢查結果</text>
  </g>

  <g>
    <rect class="card" x="304" y="98" width="260" height="214" rx="14"/>
    <circle class="purple" cx="338" cy="132" r="16"/>
    <text x="338" y="137" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">2</text>
    <text class="purple-text" x="364" y="137" font-size="15">EVIDENCE</text>
    <text class="ink" x="326" y="178" font-size="19" font-weight="700">Evidence（證據）</text>
    <line class="rule" x1="326" y1="195" x2="542" y2="195"/>
    <text class="muted" x="326" y="222" font-size="13">commit SHA 與必要 diff</text>
    <text class="muted" x="326" y="247" font-size="13">工具／環境／參數紀錄</text>
    <text class="muted" x="326" y="272" font-size="13">定義範圍內的結果</text>
  </g>

  <g>
    <rect class="card" x="584" y="98" width="260" height="214" rx="14"/>
    <circle class="purple" cx="618" cy="132" r="16"/>
    <text x="618" y="137" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">3</text>
    <text class="purple-text" x="644" y="137" font-size="15">ATTEST</text>
    <text class="ink" x="606" y="178" font-size="19" font-weight="700">Attestation（獨立確認）</text>
    <line class="rule" x1="606" y1="195" x2="822" y2="195"/>
    <text class="muted" x="606" y="222" font-size="13">對照需求與 Evidence</text>
    <text class="muted" x="606" y="247" font-size="13">審查者／審查機制</text>
    <text class="muted" x="606" y="272" font-size="13">findings／處理結果／N/A</text>
  </g>

  <g>
    <rect class="card" x="864" y="98" width="272" height="214" rx="14"/>
    <circle class="mint" cx="898" cy="132" r="16"/>
    <text x="898" y="137" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">4</text>
    <text class="mint-text" x="924" y="137" font-size="15">AUTHORITY</text>
    <text class="ink" x="886" y="178" font-size="19" font-weight="700">Authority（授權）</text>
    <line class="rule" x1="886" y1="195" x2="1114" y2="195"/>
    <text class="muted" x="886" y="222" font-size="13">判斷 merge／release／deploy</text>
    <text class="muted" x="886" y="247" font-size="13">依風險與治理規則決定</text>
    <text class="muted" x="886" y="272" font-size="13">不由審查通過自動取得</text>
  </g>

  <g>
    <line class="arrow" x1="290" y1="205" x2="298" y2="205"/>
    <polygon class="head" points="302,205 294,200 294,210"/>
    <line class="arrow" x1="570" y1="205" x2="578" y2="205"/>
    <polygon class="head" points="582,205 574,200 574,210"/>
    <line class="arrow" x1="850" y1="205" x2="858" y2="205"/>
    <polygon class="head" points="862,205 854,200 854,210"/>
  </g>

  <line class="dash" x1="45" y1="350" x2="1115" y2="350"/>
  <text class="ink" x="580" y="382" text-anchor="middle" font-size="14" font-weight="700">Evidence 是結果紀錄；Attestation 是對證據是否足夠的確認；Authority 仍是另一個決定</text>
</svg>
