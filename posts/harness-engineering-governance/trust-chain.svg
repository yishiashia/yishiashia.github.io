<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-label="四支柱信任鏈：Contract 合約、Evidence 證據、Attestation 見證、Authority 授權，依序串成一條鏈">
  <defs>
    <style>
      .bg{fill:#f6f9fb;stroke:#e2e8f0;}
      .card{fill:#ffffff;stroke:#dbe4ec;}
      .ink{fill:#0b1728;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;}
      .muted{fill:#708199;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;}
      .badge{fill:#179f7c;}
      .badgetxt{fill:#ffffff;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;font-weight:700;}
      .en{fill:#0b1728;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;font-weight:700;}
      .arrow{stroke:#179f7c;stroke-width:2;fill:none;}
      .head{fill:#179f7c;}
      .tag{fill:#a9b4c0;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;}
    </style>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="959" height="299" rx="16"/>

  <text class="ink" x="480" y="42" text-anchor="middle" font-size="21" font-weight="700">信任是一條鏈，不是一句提示</text>
  <text class="muted" x="480" y="67" text-anchor="middle" font-size="13">Contract → Evidence → Attestation → Authority</text>

  <!-- Card 1: Contract -->
  <g>
    <rect class="card" x="24" y="92" width="200" height="150" rx="14"/>
    <circle class="badge" cx="54" cy="126" r="15"/>
    <text class="badgetxt" x="54" y="131" text-anchor="middle" font-size="14">1</text>
    <text class="en" x="78" y="131" font-size="15">Contract</text>
    <text class="ink" x="44" y="172" font-size="19" font-weight="700">合約</text>
    <text class="muted" x="44" y="204" font-size="13">綁死「完成的定義」</text>
  </g>

  <!-- Card 2: Evidence -->
  <g>
    <rect class="card" x="261" y="92" width="200" height="150" rx="14"/>
    <circle class="badge" cx="291" cy="126" r="15"/>
    <text class="badgetxt" x="291" y="131" text-anchor="middle" font-size="14">2</text>
    <text class="en" x="315" y="131" font-size="15">Evidence</text>
    <text class="ink" x="281" y="172" font-size="19" font-weight="700">證據</text>
    <text class="muted" x="281" y="204" font-size="13">可重現的機器事實</text>
  </g>

  <!-- Card 3: Attestation -->
  <g>
    <rect class="card" x="498" y="92" width="200" height="150" rx="14"/>
    <circle class="badge" cx="528" cy="126" r="15"/>
    <text class="badgetxt" x="528" y="131" text-anchor="middle" font-size="14">3</text>
    <text class="en" x="552" y="131" font-size="15">Attestation</text>
    <text class="ink" x="518" y="172" font-size="19" font-weight="700">見證</text>
    <text class="muted" x="518" y="204" font-size="13">獨立審查、逐條覆蓋</text>
  </g>

  <!-- Card 4: Authority -->
  <g>
    <rect class="card" x="735" y="92" width="200" height="150" rx="14"/>
    <circle class="badge" cx="765" cy="126" r="15"/>
    <text class="badgetxt" x="765" y="131" text-anchor="middle" font-size="14">4</text>
    <text class="en" x="789" y="131" font-size="15">Authority</text>
    <text class="ink" x="755" y="172" font-size="19" font-weight="700">授權</text>
    <text class="muted" x="755" y="204" font-size="13">誰有權放行的決定</text>
  </g>

  <!-- Arrows -->
  <g>
    <line class="arrow" x1="230" y1="167" x2="253" y2="167"/>
    <polygon class="head" points="259,167 251,162 251,172"/>
    <line class="arrow" x1="467" y1="167" x2="490" y2="167"/>
    <polygon class="head" points="496,167 488,162 488,172"/>
    <line class="arrow" x1="704" y1="167" x2="727" y2="167"/>
    <polygon class="head" points="733,167 725,162 725,172"/>
  </g>

  <text class="muted" x="480" y="282" text-anchor="middle" font-size="12">少了前面任何一塊，後面都會失去意義。</text>
</svg>
